<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com/; font-src https://fonts.gstatic.com/; img-src 'self' data:; connect-src https://fatih-reviews.fatihinceoglu2009.workers.dev; base-uri 'none'; form-action 'none'; object-src 'none'">
  <meta name="referrer" content="no-referrer">
  <meta name="robots" content="noindex, nofollow">
  <title>Control Room</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Chakra+Petch:ital,wght@0,500;0,600;0,700;1,600&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap">
  <link rel="stylesheet" href="styles.css?v=4">
  <link rel="stylesheet" href="admin.css?v=1">
</head>
<body class="admin">
  <main class="adm">
    <header class="adm-top">
      <h1 class="name"><span>CONTROL ROOM</span></h1>
      <button class="act ghost small" type="button" id="logout" hidden>Log out</button>
    </header>

    <section class="adm-card" id="login">
      <h2 class="adm-h">Enter your admin password</h2>
      <form id="login-form" class="adm-form" novalidate>
        <label class="lbl" for="pw">Password</label>
        <input id="pw" type="password" autocomplete="current-password" spellcheck="false">
        <label class="adm-check"><input type="checkbox" id="remember"> Remember on this device</label>
        <div class="form-actions">
          <button class="act" type="submit">Open</button>
          <p class="form-status" id="login-status" aria-live="polite"></p>
        </div>
      </form>
    </section>

    <div id="board" hidden>
      <section class="adm-card">
        <h2 class="adm-h">Review codes</h2>
        <p class="rev-note">Make one code per client. They type it in the review form. Each code works once.</p>
        <div class="form-actions">
          <button class="act" type="button" id="new-code">New code</button>
          <p class="form-status" id="code-status" aria-live="polite"></p>
        </div>
        <p class="adm-fresh" id="fresh" hidden></p>
        <ul class="adm-list" id="codes"></ul>
      </section>

      <section class="adm-card">
        <h2 class="adm-h">Reviews</h2>
        <p class="form-status" id="rev-status" aria-live="polite"></p>
        <ul class="adm-list" id="reviews"></ul>
      </section>
    </div>
  </main>
  <script src="admin.js?v=1"></script>
</body>
</html>
